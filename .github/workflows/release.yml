name: Release

# 推送 v 开头的 tag 即自动打包并发布 GitHub Release：
#   git tag v1.0.2 && git push origin v1.0.2
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack DSH NEXT plugin (.tgz)
        run: npm pack

      - name: Pack skill-only bundle (.zip)
        working-directory: assets
        run: |
          # zip 内保留顶层 lean4-prover/ 目录，内含大写 SKILL.md
          test -f lean4-prover/SKILL.md
          zip -r ../lean4-prover-skill.zip lean4-prover

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-lean4-prover-*.tgz
            lean4-prover-skill.zip
